name: Typecheck
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - name: Validate Vercel server entrypoint
        run: |
          node --input-type=module -e 'const m=await import("./dist/src/app.js"); if(typeof m.default !== "function") process.exit(1);'
      - name: Verify RD read catalog and pagination
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {endpoints,validateReadQuery,routeFor} from "./dist/src/policy.js";
          import {readPages} from "./dist/src/pagination.js";
          const reads=Object.entries(endpoints).filter(([,e])=>e.method==="GET");
          assert.equal(reads.length,27);
          assert.equal(routeFor("contact_get",{identifier:"email",value:"a@b.com"}),"/platform/contacts/email:a%40b.com");
          assert.throws(()=>validateReadQuery("contact_create",{}),/não autorizada/);
          assert.throws(()=>validateReadQuery("segmentations",{unsafe:true}),/não documentado/);
          const fake={call:async(op)=>({data:{contacts:[{id:(Number(op.query.page)-1)*2+1},{id:(Number(op.query.page)-1)*2+2}]},pagination:{total:"6",page:String(op.query.page),page_size:"2"}})};
          const r=await readPages(fake,"segmentation_contacts",{id:1},{page:1},{maxPages:2,maxItems:6,pageSize:2});
          assert.equal(r.complete,false);
          assert.equal(r.truncated,true);
          assert.equal(r.items_returned,4);
          assert.equal(r.next_page,3);
          const r2=await readPages(fake,"segmentation_contacts",{id:1},{page:3},{maxPages:2,maxItems:6,pageSize:2});
          assert.equal(r2.complete,true);
          assert.equal(r2.items_returned,2);
          console.log("Catalog and pagination tests passed");
          NODE
      - name: Smoke-test server without production secrets
        run: |
          set -e
          PORT=3030 node dist/src/http.js > server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for n in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3030/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/health.json
          node -e 'const h=require("/tmp/health.json");if(h.status!=="ok")process.exit(1)'
          curl -fsS http://127.0.0.1:3030/
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3030/mcp)" = "503"
          echo "Server startup and authentication fail-closed: OK"
